# Rex configuration: every setting with its built-in default.
#
# `rex config defaults` prints this file. Copy the lines you want to
# change into ~/.config/rex/config; anything you leave out keeps the value
# shown here.
#
# Syntax
#   key = value          a setting; `key value` and `key: value` work too
#   [section]            the settings below it belong to `section`
#   [section.sub]        a subsection
#   # comment            at the start of a line, or after a value when the
#                        `#` has whitespace on both sides: `size = 16 # big`
#   "text"               quotes keep spaces and `#`; \\ \" \' \n \t \xHH
#                        and \u{...} are escapes inside quotes
#
# Values
#   true, false          switches
#   16, 0.5              whole numbers and decimals, no signs or exponents
#   500ms, 30s, 25m, 1h  durations always take a unit
#   default              any setting: back to the value in this file
#   none, inherit        where a setting says so
#
# Names are written exactly as here: lowercase, with underscores.

# Color theme preset.
theme = graphite

[font]
# Variable font file: required, Rex has no default font yet (#20).
# ~/ is your home directory; a relative path is relative to this file.
# file = ~/.local/share/fonts/YourFont-Variable.ttf
# Variable italic font file, or none to slant the upright font.
italic_file = none
# Font file for emoji, or none (emoji then come from the fallbacks).
emoji_file = none
# Fonts searched, in order, for characters the font above lacks (CJK,
# symbols, emoji). One path per line; the lines replace the list of a file
# applied earlier, and none empties it. Missing files are skipped.
#   fallback = /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
#   fallback = /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
fallback = none
# Font size in logical pixels (pixels at 100% display scaling).
size = 14
# Step of increase_font_size and decrease_font_size, in logical pixels.
size_step = 2
# Smallest and largest size those actions reach.
min_size = 6
max_size = 196
# Weight of regular and bold text, 1 to 1000 (400 is regular).
weight = 400
bold_weight = 800

[window]
# Opacity of the window background, 0 (transparent) to 1 (opaque).
background_opacity = 1
# Opacity of dim (SGR 2) text.
dim_text_opacity = 0.5
# Ask before closing the window while a program is running.
confirm_quit = true
# Display server: auto, wayland or x11. Linux only; takes effect after a restart.
platform = auto
# Size the window opens with, in logical pixels.
width = 1920
height = 1080

[bell]
# Sound the bell on BEL and when a focus phase changes.
enabled = true
# Volume, 0 to 1, of the X server's bell volume.
volume = 1

[surface]
# Look of every surface: the wellbeing cards, notifications, the banner and
# dialogs. A section below can set its own; inherit takes it from here.
# Corner radius and border width in logical pixels.
corner_radius = 8
border_width = 1
# rounded or sharp (sharp ignores corner_radius).
border_shape = rounded
# semantic (tinted by the kind of message) or subtle.
border_style = semantic

[card]
# The wellbeing panels.
corner_radius = inherit
border_width = inherit
border_shape = inherit
border_style = inherit

[toast]
# Short notifications in a corner of the window.
enabled = true
# top_right, top_center or bottom_right.
position = top_right
# How long a notification stays.
duration = 5s
# Width in terminal columns.
min_cols = 32
max_cols = 48
# Distance from the window edge, in columns and rows.
margin_cols = 2
margin_rows = 1
corner_radius = inherit
border_width = inherit
border_shape = inherit
border_style = inherit

[banner]
# The banner that reports config errors.
enabled = true
# floating (over the terminal) or docked (to the top edge).
placement = floating
# top_center, top_right or top_left.
position = top_center
# Width in terminal columns.
min_cols = 36
max_cols = 72
# Distance from the window edge, in columns and rows.
margin_cols = 2
margin_rows = 1
corner_radius = inherit
border_width = inherit
border_shape = inherit
border_style = inherit

[modal]
# Dialogs such as the quit confirmation.
# Width in terminal columns.
cols = 46
# Opacity of the darkened backdrop behind the dialog, 0 to 1.
backdrop_opacity = 0.7058824
# Close the dialog when clicking outside it.
close_on_outside_click = true
# Button focused when the dialog opens: confirm or cancel.
default_focus = confirm
corner_radius = inherit
border_width = inherit
border_shape = inherit
border_style = inherit

[modal.blur]
# Blur the terminal behind the dialog.
enabled = false
# Blur radius in pixels.
radius = 12

[wellbeing]
# Digital wellbeing: screen time, focus timer and reminders.
enabled = true

[wellbeing.screen_time]
# Daily screen time limit, or none.
daily_limit = 8h
# Time without input after which screen time stops counting.
idle_threshold = 3m

[wellbeing.focus]
# Lengths of a focus session and of the breaks between them.
task = 25m
short_break = 5m
long_break = 15m
# Focus sessions before a long break.
tasks_before_long_break = 4
# Block terminal input during breaks.
lock_input_on_break = false
show_break_animation = true
# Hold back notifications during a focus session.
mute_notifications_in_task = true

[scroll]
# Lines moved by the scroll_up and scroll_down actions.
step_lines = 3
# Lines moved per mouse wheel step.
wheel_lines = 3

[keybinds]
# chord = action. A chord is ctrl, shift, alt and super, then one key, joined
# by +. Keys are a-z, 0-9, f1-f12 and names like enter, page_up, minus,
# equal, left_bracket. A binding here replaces the default for that chord.
ctrl+0 = reset_font_size
ctrl+equal = increase_font_size
ctrl+minus = decrease_font_size
ctrl+shift+c = copy_selection
ctrl+shift+v = paste_clipboard
ctrl+shift+n = new_window
ctrl+shift+q = quit
ctrl+shift+f5 = reload_config
ctrl+shift+f6 = debug
ctrl+shift+j = scroll_down
ctrl+shift+k = scroll_up
ctrl+shift+p = focus_toggle
ctrl+shift+backspace = focus_reset
ctrl+shift+right_bracket = focus_skip
ctrl+shift+a = focus_auto_transition
ctrl+shift+w = wellbeing_dashboard
ctrl+shift+d = wellbeing_dismiss
ctrl+shift+t = wellbeing_toast_toggle
