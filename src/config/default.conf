# Rex configuration: every setting with its built-in default.
#
# `rex config defaults` prints this file. Copy the lines you want to
# change into ~/.config/rex/config; anything you leave out keeps the value
# shown here.
#
# Syntax
#   key = value          a setting; `key value` and `key: value` work too
#   [section]            the settings below it belong to `section`
#   [section.sub]        a subsection
#   # comment            at the start of a line, or after a value when the
#                        `#` has whitespace on both sides: `size = 16 # big`
#   "text"               quotes keep spaces and `#`; \\ \" \' \n \t \xHH
#                        and \u{...} are escapes inside quotes
#
# Values
#   true, false          switches
#   16, 0.5              whole numbers and decimals, no signs or exponents
#   500ms, 30s, 25m, 1h  durations always take a unit
#   default              any setting: back to the value in this file
#   none, inherit        where a setting says so
#
# Names are written exactly as here: lowercase, with underscores.

# Color theme preset.
theme = graphite

[font]
# Font file of regular text. Omitted, Rex uses Google Sans Code from the
# faces installed next to the executable (`share/rex/fonts`). Set a path
# to replace it. ~/ is your home directory; a relative path is relative
# to this file.
# file = ~/.local/share/fonts/YourFont-Regular.ttf
# Files of the other styles, or none. Without one, bold and italic use
# `file`, and bold italic uses italic_file, else `file`. A variable font
# gets the weights below; a static one is used as it is (no fake bold or
# slant). `italic_file` omitted, and `file` omitted too, uses the shipped
# italic. `italic_file = none` keeps the regular face for italic.
bold_file = none
bold_italic_file = none
# Emoji face, or none. Omitted, Rex uses the shipped Noto Color Emoji.
# `emoji_file = none` turns emoji off.

# Fonts searched, in order, for characters the font above lacks (CJK,
# symbols, emoji). One path per line; the lines replace the list of a file
# applied earlier, and none empties it. Missing files are skipped.
#   fallback = /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
#   fallback = /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
fallback = none
# Font size in logical pixels (pixels at 100% display scaling).
size = 14
# Step of increase_font_size and decrease_font_size, in logical pixels.
size_step = 2
# Smallest and largest size those actions reach.
min_size = 6
max_size = 196
# Weight of regular and bold text, 1 to 1000 (400 is regular), for variable
# fonts.
weight = 400
bold_weight = 800

[window]
# Opacity of the window background, 0 (transparent) to 1 (opaque).
background_opacity = 1
# Opacity of dim (SGR 2) text.
dim_text_opacity = 0.5
# Closing the window: ask (show the quit dialog first), ask_if_running (only
# while a program other than the shell runs in the foreground; background
# jobs don't count) or close.
on_close = ask_if_running
# Display server: auto, wayland or x11; takes effect after a restart. On
# macOS auto is Cocoa and the other two fail at start.
platform = auto
# Size the window opens with, in logical pixels.
width = 1920
height = 1080
# Window title: auto (the title programs set, else "rex") or fixed text,
# like "Rex", which programs can't change.
title = auto

[bell]
# Sound the bell on BEL and when a focus phase changes.
enabled = true
# Volume, 0 to 1, of the X server's bell volume.
volume = 1

[surface]
# Look of every surface: the wellbeing cards, notifications, the banner and
# dialogs. A section below can set its own; inherit takes it from here.
# Corner radius and border width in logical pixels.
corner_radius = 8
border_width = 1
# rounded or sharp (sharp ignores corner_radius).
border_shape = rounded
# semantic (tinted by the kind of message) or subtle.
border_style = semantic

[card]
# The wellbeing panels.
corner_radius = inherit
border_width = inherit
border_shape = inherit
border_style = inherit

[toast]
# Short notifications in a corner of the window.
enabled = true
# top_right, top_center or bottom_right.
position = top_right
# How long a notification stays.
duration = 5s
# Width in terminal columns.
min_cols = 32
max_cols = 48
# Distance from the window edge, in columns and rows.
margin_cols = 2
margin_rows = 1
corner_radius = inherit
border_width = inherit
border_shape = inherit
border_style = inherit

[banner]
# The banner that reports config errors.
enabled = true
# floating (over the terminal) or docked (to the top edge).
placement = floating
# top_center, top_right or top_left.
position = top_center
# Width in terminal columns.
min_cols = 36
max_cols = 72
# Distance from the window edge, in columns and rows.
margin_cols = 2
margin_rows = 1
corner_radius = inherit
border_width = inherit
border_shape = inherit
border_style = inherit

[modal]
# Dialogs such as the quit confirmation.
# Width in terminal columns.
cols = 46
# Opacity of the darkened backdrop behind the dialog, 0 to 1.
backdrop_opacity = 0.7058824
# A click outside the dialog: close it, or ignore the click.
on_outside_click = close
# Button focused when the dialog opens: confirm or cancel.
default_focus = confirm
corner_radius = inherit
border_width = inherit
border_shape = inherit
border_style = inherit

[modal.blur]
# Blur the terminal behind the dialog.
enabled = false
# Blur radius in pixels.
radius = 12

[wellbeing]
# Digital wellbeing: screen time, focus timer and reminders.
enabled = true

[wellbeing.screen_time]
# Daily screen time limit, or none.
daily_limit = none
# Time without input after which screen time stops counting.
idle_threshold = 3m
# What happens once daily_limit is reached: none, or any of grayscale (fade
# to grayscale over grayscale_transition), lock_input (block terminal input
# while the alert is shown) and animation, separated by commas.
on_limit = grayscale
grayscale_transition = 30s

[wellbeing.focus]
# Lengths of a focus session and of the breaks between them.
task = 25m
short_break = 5m
long_break = 15m
# Focus sessions before a long break.
tasks_before_long_break = 4
# The timer shows the time left (countdown) or the time spent (countup).
timer = countdown
# When a phase ends: wait for you to start the next one, or start_next.
on_phase_end = wait
# Actions are none, or a list separated by commas.
# During a focus session: mute_bell.
during_task = mute_bell
# When a break starts: prompt (show a suggestion), lock_input (block terminal
# input for the whole break), animation (animate the screen; shows the
# prompt too).
on_break = prompt, animation
# While a reminder blocks input: pause (pause the focus timer).
on_alert = pause

[wellbeing.winddown]
# An evening window that warms the screen colors and can mute the bell.
enabled = false
# Local time, HH:MM on the 24-hour clock. The window crosses midnight when
# end is earlier than start; start and end must differ.
start = 21:00
end = 07:00
# During the window: none, or any of warm_colors and mute_bell, separated by
# commas.
during_window = warm_colors, mute_bell
# How warm warm_colors makes the screen, from 0 (unchanged) to 1.
warmth = 0.85

[wellbeing.eyesight]
# Reminder to look into the distance. Reminder timers count whole seconds of
# active use (idle time pauses them) and round an interval up.
enabled = true
interval = 20m
# How long the reminder stays on screen.
duration = 20s
# While the reminder is shown: none, or lock_input (block terminal input).
during_reminder = none
# Screen effect while the reminder is shown: none, pulse_dim, grayscale_wave
# or warm_glow.
animation = pulse_dim

[wellbeing.movement]
# Reminder to stand up and move.
enabled = true
interval = 50m
duration = 60s
during_reminder = none
animation = grayscale_wave

[wellbeing.privacy]
# Record which program runs in the terminal, for the per-app time in the
# dashboard. All wellbeing data stays on this machine.
track_foreground_apps = true

[wellbeing.dashboard]
# The wellbeing window (rex wellbeing): the focus timer's progress as a bar
# or a ring, and each program's share as bars or a donut.
timer_chart = bar
program_chart = bar

[ui]
# Toasts and dialogs drawn by the UI kit (a trial, on with REX_UI_KIT=1):
# full fades and slides them, none makes every change instant.
motion = full
# Dark or light UI; auto picks whichever reads well over the terminal's
# background.
color_scheme = auto

[scroll]
# Lines moved by the scroll_up and scroll_down actions.
step_lines = 3
# Lines moved per mouse wheel step.
wheel_lines = 3

[selection]
# Characters that count as part of a word when double-clicking, besides
# letters, digits and _; quote them, like "-./~@".
extra_word_characters = ""

[clipboard]
# Programs setting the clipboard with OSC 52 (nvim and tmux over ssh do):
# allow or deny. Any program that prints to the terminal can then replace
# what you copied.
osc52_write = allow
# Programs reading the clipboard with OSC 52: deny (they get an empty reply)
# or allow. With allow, any program, even one over ssh, can read what you
# copied, passwords included.
osc52_read = deny

[shell]
# What runs in the terminal. Read when Rex starts; if it can't start, Rex
# starts your login shell in its own directory and shows the error.
# An absolute path (~/ allowed), or auto: $SHELL, then your login shell,
# then /bin/sh.
program = auto
# Arguments for the program, one per line; none for no arguments. Quote one
# that is a keyword: argument = "none".
argument = none
# The directory to start in, or inherit: the one Rex was started in.
working_directory = inherit

[env]
# Variables for programs started in the terminal, NAME = value; the rest of
# the environment is inherited from Rex. A later file replaces a variable by
# name. Quote a value with spaces or #; a bare none is reserved.
TERM = xterm-256color
COLORTERM = truecolor

[keybinds]
# chord = action. A chord is ctrl, shift, alt and super, then one key, joined
# by +. Keys are a-z, 0-9, f1-f12 and names like enter, page_up, minus,
# equal, left_bracket. A binding here replaces the default for that chord.
ctrl+0 = reset_font_size
ctrl+equal = increase_font_size
ctrl+minus = decrease_font_size
ctrl+shift+c = copy_selection
ctrl+shift+v = paste_clipboard
ctrl+shift+n = new_window
ctrl+shift+q = quit
ctrl+shift+f5 = reload_config
ctrl+shift+j = scroll_down
ctrl+shift+k = scroll_up
ctrl+shift+p = focus_toggle
ctrl+shift+backspace = focus_reset
ctrl+shift+right_bracket = focus_skip
ctrl+shift+a = focus_toggle_phase_end
ctrl+shift+w = wellbeing_dashboard
ctrl+shift+d = wellbeing_dismiss
