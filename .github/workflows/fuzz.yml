name: fuzz

# Short runs on every push, a long run nightly (GitHub runs `schedule`
# only from the default branch). The corpus is cached per target so each
# run continues from the last. A crash fails the job and uploads the
# input as an artifact; to keep it, see the fuzzing section of
# CONTRIBUTING.md.

on:
  push:
    branches: [master, develop]
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:
    inputs:
      minutes:
        description: "Fuzzing minutes per target"
        default: "60"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [config, parser, terminal, strings, utf8, grapheme, wcwidth]
    env:
      # Fuzzing time per target: 2 minutes on push, an hour nightly. Runs
      # per second differ widely between targets (grapheme did 50M runs in
      # 13 minutes; five others did not finish 50M in 90), so the budget is
      # time, not a run count.
      MINUTES: ${{ github.event_name == 'push' && '2' || inputs.minutes || '60' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libxext-dev libgl-dev libegl-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            libpng-dev zlib1g-dev

      - uses: mlugg/setup-zig@v2.2.1

      # Zig 0.16.0 unpacks .zip dependencies through <global cache>/tmp but
      # never creates that directory, so a fresh cache fails with "failed to
      # create temporary zip file: FileNotFound". Drop with the zip
      # dependencies (#65) or a fixed Zig.
      - run: mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"

      - name: Restore corpus
        uses: actions/cache@v6
        with:
          path: .zig-cache/f
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-

      # The Zig cache restored by setup-zig is shared by all targets and
      # may hold another run's crash file; drop it so an upload below is
      # always this run's.
      - name: Remove stale crash
        run: rm -f .zig-cache/f/crash

      # Build and replay seeds and regressions first, so a build error
      # fails here and is not mistaken for a fuzzer crash.
      - name: Build and replay ${{ matrix.target }}
        run: zig build fuzz-${{ matrix.target }} -Dllvm

      # Limited runs in chunks until the time is up. Each chunk ends on its
      # own, so nothing is killed: a killed run saves its current input as
      # if it were a crash. The corpus in .zig-cache/f carries over between
      # chunks. Each chunk is sized from the last to take about 3 minutes,
      # so the time is overshot by at most one chunk.
      # zig 0.16.0's build runner exits 0 when a limited --fuzz run finds a
      # crash (it only prints "input saved"), so the crash file is what
      # fails the step; the stale one was removed above.
      - name: Fuzz ${{ matrix.target }}
        id: fuzz
        run: |
          deadline=$(( $(date +%s) + MINUTES * 60 ))
          runs=100000
          while [ "$(date +%s)" -lt "$deadline" ]; do
            start=$(date +%s)
            zig build fuzz-${{ matrix.target }} -Dllvm --fuzz=$runs
            if [ -e .zig-cache/f/crash ]; then
              echo "::error::fuzz-${{ matrix.target }} found a crash; the input is in the crash-${{ matrix.target }} artifact"
              exit 1
            fi
            took=$(( $(date +%s) - start ))
            [ "$took" -gt 0 ] || took=1
            runs=$(( runs * 180 / took ))
            [ "$runs" -ge 100000 ] || runs=100000
            [ "$runs" -le 100000000 ] || runs=100000000
          done

      - name: Upload crash
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: crash-${{ matrix.target }}
          path: .zig-cache/f/crash
          if-no-files-found: ignore
