name: fuzz

# Short runs on every push, a long run nightly. The corpus is cached
# per target so each run continues from the last. A crash fails the
# job and uploads the input as an artifact; to keep it, see the
# fuzzing section of CONTRIBUTING.md.

on:
  push:
    branches: [master, develop]
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per target"
        default: "50000000"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [config, parser, terminal, strings, utf8, grapheme, wcwidth]
    env:
      # About 1 minute per target on push, about an hour nightly.
      RUNS: ${{ github.event_name == 'push' && '1000000' || inputs.runs || '50000000' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libxext-dev libgl-dev libegl-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            libpng-dev zlib1g-dev

      - uses: mlugg/setup-zig@v2.2.1

      - name: Restore corpus
        uses: actions/cache@v6
        with:
          path: .zig-cache/f
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.target }}-

      # The Zig cache restored by setup-zig is shared by all targets and
      # may hold another run's crash file; drop it so an upload below is
      # always this run's.
      - name: Remove stale crash
        run: rm -f .zig-cache/f/crash

      # Build and replay seeds and regressions first, so a build error
      # fails here and is not mistaken for a fuzzer crash.
      - name: Build and replay ${{ matrix.target }}
        run: zig build fuzz-${{ matrix.target }} -Dllvm

      - name: Fuzz ${{ matrix.target }}
        id: fuzz
        run: zig build fuzz-${{ matrix.target }} -Dllvm --fuzz=$RUNS

      - name: Upload crash
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: crash-${{ matrix.target }}
          path: .zig-cache/f/crash
          if-no-files-found: ignore
